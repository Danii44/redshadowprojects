[package]
name = "redshadowprojects-desktop"
version = "0.1.0"
description = "Red Shadow Projects Windows desktop client"
authors = ["Red Shadow Designs"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
url = "2"
